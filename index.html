<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cyber Escape Room</title>
    <style>
      body {
         background: #050b08; color: #c9f7d8;
         font-family: 'Courier New', monospace;
      }
      .wrap {max-width: 640px; margin: 0 auto; }
      h1 { text-align: center; color: #39ff88; letter-spacing: 2px; font-size: 1.3rem; }
      h2 { color: #39ff88; font-size: 1.05rem; margin-top: 0 }
      p { line-height: 1.55; font-size: 0.92rem; }
  #progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .dot { width: 14px; height: 14px; border: 1px solid #1f8c52; transform: rotate(45deg); }
  .dot.done { background: #39ff88; }
  .dot.current { border-color: #ffcc55; }
  #stage { background: #0b140f; border: 1px solid #1c3324; border-radius: 4px; padding: 20px; }
  .clue { background: #08110c; border-left: 3px solid #1f8c52; padding: 10px 12px; margin: 10px 0; }
  input[type=text] {
    width: 100%; box-sizing: border-box; background: #08110c; color: #39ff88;
    border: 1px solid #1f8c52; border-radius: 3px; padding: 10px;
    font-family: inherit; font-size: 0.95rem; margin-top: 8px;
  }
  button {
    font-family: inherit; background: transparent; color: #39ff88;
    border: 1px solid #39ff88; border-radius: 3px; padding: 10px 16px;
    cursor: pointer; margin-top: 12px;
  }
  button:hover { background: #39ff88; color: #050b08; }
  .choice {
    background: #08110c; border: 1px solid #1c3324; border-radius: 3px;
    padding: 12px; margin: 8px 0; cursor: pointer; font-size: 0.88rem;
  }
  .choice:hover { border-color: #1f8c52; }
  .fb { margin-top: 12px; font-size: 0.88rem; min-height: 1.2em; }
  .ok { color: #39ff88; }
  .bad { color: #ff5c5c; }
  .flag { color: #ffcc55; font-size: 1.1rem; margin: 14px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>&gt; CYBER ESCAPE ROOM_</h1>
    <div id="progress"></div>
    <div id="stage"></div>
    <div style="text-align:center"><button onclick="restart()">restart</button></div>
  </div>

<script>
  // ---------- STATE ----------
  let state = { room: 0, solved: [false, false, false, false, false, false] };

  // restore saved progress (if any)
  try {
    const saved = JSON.parse(localStorage.getItem('escapeState'));
    if (saved && typeof saved.room === 'number') state = saved;
  } catch (e) {}

  function save() {
    try { localStorage.setItem('escapeState', JSON.stringify(state)); } catch (e) {}
  }

  // ---------- HELPERS ----------
  function feedback(id, ok, msg) {
    const f = document.getElementById(id);
    f.textContent = msg;
    f.className = 'fb ' + (ok ? 'ok' : 'bad');
  }

  function solveAndAdvance(roomIndex) {
    state.solved[roomIndex] = true;
    save();
    setTimeout(function () {
      state.room = state.room + 1;
      save();
      render();
    }, 800);
  }

  // ---------- ROOMS ----------
  function room0() {
    return `
      <h2>LOCK 1: Password Cracking</h2>
      <p>An old admin account guards the door. You found a sticky note:</p>
      <div class="clue">Dog's name: <b>Byte</b> | Joined the company: <b>2017</b><br>
      Policy: password = DogName + JoinYear</div>
      <input type="text" id="ans0" placeholder="enter password" autocomplete="off">
      <button onclick="check0()">Unlock</button>
      <div id="fb0" class="fb"></div>
    `;
  }
  function check0() {
    const v = document.getElementById('ans0').value.trim().toLowerCase();
    if (v === 'byte2017') {
      feedback('fb0', true, '✓ Correct! Door unlocking...');
      solveAndAdvance(0);
    } else {
      feedback('fb0', false, '✗ Not quite. Combine the clues exactly as the policy says.');
    }
  }

  function room1() {
    return `
      <h2>LOCK 2: Phishing Detection</h2>
      <p>Three emails just arrived. Click the phishing one.</p>
      <div class="choice" onclick="pickEmail(false)">
        <b>From:</b> it-support@yourcompany.com<br>
        <b>Subject:</b> Scheduled maintenance tonight 11pm–1am</div>
      <div class="choice" onclick="pickEmail(true)">
        <b>From:</b> security-alert@yourcompany-verify.net<br>
        <b>Subject:</b> URGENT: Your account will be suspended in 1 hour — verify now!</div>
      <div class="choice" onclick="pickEmail(false)">
        <b>From:</b> hr@yourcompany.com<br>
        <b>Subject:</b> Updated holiday calendar attached</div>
      <div id="fb1" class="fb"></div>
    `;
  }
  function pickEmail(isPhish) {
    if (isPhish) {
      feedback('fb1', true, '✓ Correct: urgency, a scare tactic, and a lookalike domain.');
      solveAndAdvance(1);
    } else {
      feedback('fb1', false, "✗ Not this one. Look for urgency and a domain that isn't quite right.");
    }
  }

  function room2() {
    return `
      <h2>LOCK 3: Find Hidden Clues</h2>
      <p>A log file was left behind. Something is hidden in how it reads.</p>
      <div class="clue" style="line-height:1.9">
        <b style="color:#ffcc55">R</b>estarted the backup service at midnight<br>
        <b style="color:#ffcc55">O</b>utbound traffic spiked briefly, then dropped<br>
        <b style="color:#ffcc55">U</b>ser accounts were re-synced with no errors<br>
        <b style="color:#ffcc55">T</b>emporary certs were issued for testing<br>
        <b style="color:#ffcc55">E</b>ncrypted the archive before shipping it<br>
        <b style="color:#ffcc55">R</b>eviewed the firewall rules one more time
      </div>
      <p>What word do the highlighted first letters spell? (a device that connects networks)</p>
      <input type="text" id="ans2" placeholder="type the word" autocomplete="off">
      <button onclick="check2()">Unlock</button>
      <div id="fb2" class="fb"></div>
    `;
  }
  function check2() {
    const v = document.getElementById('ans2').value.trim().toLowerCase();
    if (v === 'router') {
      feedback('fb2', true, '✓ ROUTER. Well spotted.');
      solveAndAdvance(2);
    } else {
      feedback('fb2', false, '✗ Read just the highlighted first letters, top to bottom.');
    }
  }

  function room3() {
    return `
      <h2>LOCK 4: Decode Messages</h2>
      <p>A note was intercepted, encoded with a Caesar cipher (every letter shifted by 3, so A becomes D).</p>
      <div class="clue">WKH NHB LV XQGHU WKH PDW</div>
      <p>Shift each letter back by 3 and type the message:</p>
      <input type="text" id="ans3" placeholder="decoded message" autocomplete="off">
      <button onclick="check3()">Unlock</button>
      <div id="fb3" class="fb"></div>
    `;
  }
  function check3() {
    const v = document.getElementById('ans3').value.trim().toLowerCase();
    if (v === 'the key is under the mat') {
      feedback('fb3', true, '✓ Decoded correctly.');
      solveAndAdvance(3);
    } else {
      feedback('fb3', false, '✗ Not quite. Shift each letter back by 3 (D→A, E→B...).');
    }
  }

  function room4() {
    return `
      <h2>LOCK 5: Suspicious Files</h2>
      <p>One of these files is disguising itself. Click the suspicious one.</p>
      <div class="choice" onclick="pickFile(false)">📄 Q3_report.pdf — 214 KB</div>
      <div class="choice" onclick="pickFile(true)">📄 invoice_2024.pdf.exe — 3.1 MB</div>
      <div class="choice" onclick="pickFile(false)">🖼️ team_photo.jpg — 1.8 MB</div>
      <div class="choice" onclick="pickFile(false)">📊 budget.xlsx — 88 KB</div>
      <div id="fb4" class="fb"></div>
    `;
  }
  function pickFile(isBad) {
    if (isBad) {
      feedback('fb4', true, '✓ Correct: a double extension (.pdf.exe) hides a real program.');
      solveAndAdvance(4);
    } else {
      feedback('fb4', false, "✗ That one's clean. Look for a file pretending to be two types at once.");
    }
  }

  function room5() {
    return `
      <h2>LOCK 6: Networking Challenge</h2>
      <p>The final door reads its lock from a standard port number.<br>
      Which port does HTTPS traffic normally use?</p>
      <input type="text" id="ans5" placeholder="port number" autocomplete="off">
      <button onclick="check5()">Unlock &amp; Escape</button>
      <div id="fb5" class="fb"></div>
    `;
  }
  function check5() {
    const v = document.getElementById('ans5').value.trim();
    if (v === '443') {
      feedback('fb5', true, '✓ 443. The lock disengages.');
      solveAndAdvance(5);
    } else {
      feedback('fb5', false, '✗ Not that port. HTTP uses 80; HTTPS uses a different one.');
    }
  }

  // ---------- RENDERING ----------
  const stages = [room0, room1, room2, room3, room4, room5];

  function renderProgress() {
    const el = document.getElementById('progress');
    el.innerHTML = '';
    for (let i = 0; i < stages.length; i++) {
      const d = document.createElement('div');
      let cls = 'dot';
      if (state.solved[i]) cls += ' done';
      else if (i === state.room) cls += ' current';
      d.className = cls;
      el.appendChild(d);
    }
  }

  function render() {
    renderProgress();
    const stage = document.getElementById('stage');
    if (state.room >= stages.length) {
      stage.innerHTML = `
        <h2>🔓 You escaped the system!</h2>
        <p>Six challenges down: passwords, phishing, hidden clues, ciphers,
        suspicious files, and networking.</p>
        <div class="flag">FLAG{cyber_escape_complete}</div>
      `;
      return;
    }
    stage.innerHTML = stages[state.room]();
  }

  function restart() {
    state = { room: 0, solved: [false, false, false, false, false, false] };
    save();
    render();
  }

  render();
</script>
</body>
</html>
